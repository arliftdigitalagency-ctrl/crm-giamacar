<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Giama Car · CRM Meta Ads</title>
<meta name="theme-color" content="#0A090B">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.3/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* === Palette Giama Car (nero · bordeaux · platino) === */
  --bg:#0A090B;--surface:#151318;--surface-2:#1C1920;--surface-3:#26222B;
  --line:#2B2730;--line-2:#3A3442;
  --accent:#9E2336;--accent-2:#C42A41;--accent-d:#6E1726;--accent-soft:#26101A;
  --metal:#EFEEF1;--metal-2:#C7C5CC;
  --tx:#F2F0F4;--tx-2:#ADA7B2;--tx-3:#7E7884;--tx-4:#564F5C;
  --green:#3FBF84;--red:#E5544B;--blue:#5B93E8;--amber:#E0A43A;--purple:#9F7BE0;--cyan:#3FB6C4;--grey:#6E6A72;
  --r:8px;--rl:12px;--rxl:16px;
  --sh-sm:0 1px 2px rgba(0,0,0,.45);
  --sh:0 4px 16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35);
  --sh-lg:0 18px 46px rgba(0,0,0,.62),0 6px 14px rgba(0,0,0,.45);
}
html,body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 600px at 78% -8%,rgba(158,35,54,.10),transparent 60%),var(--bg)}

.app{display:flex;min-height:100vh}
.sb{width:250px;background:linear-gradient(180deg,#121013,#0B0A0C);position:fixed;height:100vh;display:flex;flex-direction:column;z-index:100;border-right:1px solid var(--line);overflow-y:auto}
.main{margin-left:250px;flex:1;padding:26px 30px;min-height:100vh;width:calc(100% - 250px)}

.logo{padding:20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo img{width:42px;height:42px;border-radius:10px;border:1px solid var(--line-2);flex-shrink:0;display:block}
.logo-tx b{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--metal);display:block;line-height:1.1}
.logo-tx span{font-size:10px;color:var(--tx-3);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.logo-tx span em{color:var(--accent-2);font-style:normal}

.nav{flex:1;padding:12px}
.nav-sec{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--tx-4);padding:14px 12px 6px;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--tx-2);cursor:pointer;transition:all .15s;font-size:13.5px;font-weight:600;margin-bottom:2px;user-select:none;position:relative}
.nav-i:hover{background:var(--surface-2);color:var(--tx)}
.nav-i.active{background:linear-gradient(90deg,rgba(196,42,65,.16),rgba(196,42,65,.03));color:var(--metal)}
.nav-i.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--accent-2);border-radius:0 3px 3px 0}
.nav-i svg{width:18px;height:18px;color:var(--tx-3);flex-shrink:0}
.nav-i.active svg{color:var(--accent-2)}
.nav-bd{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:10.5px;font-weight:800;line-height:1.5}
.nav-bd.alt{background:var(--surface-3);color:var(--tx-2)}

.usr{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.usr-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0;background:linear-gradient(145deg,var(--accent-2),var(--accent-d))}
.usr-info{flex:1;min-width:0}
.usr-name{font-size:12.5px;font-weight:700;color:var(--tx)}
.usr-email{font-size:10.5px;color:var(--tx-3)}
.usr-out{padding:7px;color:var(--tx-3);cursor:pointer;border-radius:7px}
.usr-out:hover{background:var(--surface-2);color:var(--red)}

.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:14px;flex-wrap:wrap}
.ph-t{font-family:'Sora',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.ph-s{font-size:13px;color:var(--tx-3);margin-top:6px}
.ph-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all .14s;border:none;font-family:'Manrope',sans-serif;white-space:nowrap;line-height:1.4}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(180deg,#FFFFFF,#D7D5DB);color:#141118;box-shadow:var(--sh)}.btn-p:hover:not(:disabled){background:linear-gradient(180deg,#FFFFFF,#E7E5EB);transform:translateY(-1px)}
.btn-a{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 4px 14px rgba(158,35,54,.4)}.btn-a:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:var(--surface-2);color:var(--tx);border:1px solid var(--line-2)}.btn-s:hover:not(:disabled){background:var(--surface-3);border-color:var(--tx-4)}
.btn-d{background:transparent;color:var(--red);border:1px solid rgba(229,84,75,.3)}.btn-d:hover:not(:disabled){background:rgba(229,84,75,.1)}
.btn-g{background:transparent;color:var(--tx-3);border:1px solid transparent}.btn-g:hover:not(:disabled){background:var(--surface-2);color:var(--tx)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;gap:5px}
.btn svg{width:15px;height:15px;flex-shrink:0}

.card{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh-sm);padding:20px;border:1px solid var(--line)}
.card-t{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;margin-bottom:16px}

.fg{margin-bottom:15px}.fg:last-child{margin-bottom:0}
.flbl{display:block;font-size:11px;font-weight:700;color:var(--tx-2);margin-bottom:6px;letter-spacing:.02em}
.fc{width:100%;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif;color:var(--tx);transition:border-color .14s;background:var(--surface-2);outline:none}
.fc:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(196,42,65,.16)}
.fc::placeholder{color:var(--tx-4)}
select.fc{cursor:pointer}select.fc option{background:var(--surface-2);color:var(--tx)}
textarea.fc{resize:vertical;min-height:80px;font-family:'Manrope',sans-serif}
.frow{display:grid;gap:13px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}

.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sc{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh-sm);padding:18px;border:1px solid var(--line);position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.02),transparent 60%);pointer-events:none}
.si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.si svg{width:19px;height:19px}
.sv{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;line-height:1;letter-spacing:-.01em}
.sl{font-size:12px;color:var(--tx-3);margin-top:6px;font-weight:600}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.01em}
.badge .bdot{width:6px;height:6px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--tx-2)}

/* === Pipeline === */
.pipe-leg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pipe-leg-i{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--tx-3);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.kb{display:grid;grid-template-columns:repeat(6,minmax(238px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.kb-col{background:var(--surface);border-radius:var(--rl);min-height:360px;display:flex;flex-direction:column;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh-sm)}
.kb-col.over{border-color:var(--col-c);box-shadow:0 0 0 2px var(--col-c)}
.kb-col-top{height:4px;background:var(--col-c,#71717A)}
.kb-col-h{display:flex;align-items:center;gap:9px;padding:13px 14px 11px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.kb-col-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--col-c);background:var(--col-soft);flex-shrink:0}
.kb-col-ic svg{width:15px;height:15px}
.kb-col-t{font-size:11.5px;font-weight:800;color:var(--tx);text-transform:uppercase;letter-spacing:.05em;flex:1;line-height:1.2}
.kb-col-cnt{background:var(--surface);color:var(--tx-2);font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:11px;border:1px solid var(--line-2);min-width:24px;text-align:center}
.kb-col-sum{font-size:10px;color:var(--tx-4);font-weight:700;padding:6px 14px 0}
.kb-col-body{flex:1;display:flex;flex-direction:column;gap:9px;padding:10px;min-height:60px;overflow-y:auto;max-height:64vh}
.kb-card{background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--line);cursor:grab;transition:all .15s;position:relative;display:flex;flex-direction:column;gap:9px}
.kb-card:hover{border-color:var(--accent-2);box-shadow:var(--sh);transform:translateY(-1px)}
.kb-card.drag{opacity:.4;transform:rotate(1.5deg) scale(.98)}
.kb-card-top{display:flex;align-items:center;gap:9px}
.kb-card-av{width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.kb-card-nm{font-size:12.5px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-card-sub{font-size:10.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.kb-card-svc{font-size:11px;font-weight:700;color:var(--metal);background:var(--surface-3);padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;max-width:100%}
.kb-card-svc svg{flex-shrink:0;color:var(--accent-2)}
.kb-card-svc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-card-ft{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kb-card-val{font-size:12px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx)}
.kb-card-tm{font-size:10px;color:var(--tx-4);font-weight:600}
.kb-card-src{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%}
.kb-adv{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:9px}
.kb-adv-b{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:800;cursor:pointer;border:none;background:var(--nx-soft);color:var(--nx-c);transition:all .14s}
.kb-adv-b:hover{filter:brightness(1.12)}
.kb-adv-b svg{width:13px;height:13px}
.kb-adv-x{width:32px;flex:0 0 auto;background:var(--surface-3);color:var(--tx-3);display:inline-flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;border:1px solid var(--line);transition:all .14s}
.kb-adv-x:hover{color:var(--red);border-color:rgba(229,84,75,.4)}
.kb-adv-x svg{width:13px;height:13px}

/* === Tabella / lista === */
.tw{overflow-x:auto;background:var(--surface);border-radius:var(--rl);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:12px 15px;background:var(--surface-2);color:var(--tx-3);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--tx-2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.cell-nm{display:flex;align-items:center;gap:10px}
.cell-av{width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}

.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.fp{padding:7px 13px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);color:var(--tx-2);font-size:12px;font-weight:700;cursor:pointer;transition:all .14s;display:inline-flex;align-items:center;gap:6px}
.fp:hover{border-color:var(--tx-4);color:var(--tx)}
.fp.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.fp-cnt{background:rgba(0,0,0,.2);padding:1px 6px;border-radius:9px;font-size:10.5px;font-weight:800}
.srch{position:relative;flex:1;min-width:200px;max-width:340px}
.srch input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line-2);border-radius:8px;font-size:13px;background:var(--surface);color:var(--tx);outline:none;font-family:'Manrope',sans-serif}
.srch input:focus{border-color:var(--accent-2)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tx-4)}

/* === Campagne === */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.cmp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:18px;display:flex;flex-direction:column;gap:14px;transition:all .15s}
.cmp-card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh)}
.cmp-card.off{opacity:.6}
.cmp-h{display:flex;align-items:flex-start;gap:11px}
.cmp-plat{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmp-plat svg{width:19px;height:19px;color:#fff}
.cmp-nm{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;line-height:1.25}
.cmp-meta{font-size:11px;color:var(--tx-3);margin-top:2px;font-weight:600}
.cmp-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cmp-st{background:var(--surface-2);padding:11px 10px;text-align:center}
.cmp-st-v{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;color:var(--tx)}
.cmp-st-v.acc{color:var(--accent-2)}
.cmp-st-l{font-size:9px;color:var(--tx-3);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.cmp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.cmp-cpl{font-size:12px;color:var(--tx-2);font-weight:700}
.cmp-cpl b{color:var(--metal);font-family:'Sora',sans-serif}

/* === Modal / Drawer === */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.md{background:var(--surface);border-radius:var(--rxl);width:100%;max-width:560px;box-shadow:var(--sh-lg);border:1px solid var(--line-2);animation:slideUp .22s ease;margin:auto 0}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh-t{font-family:'Sora',sans-serif;font-size:17px;font-weight:800}
.mb{padding:22px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--rxl) var(--rxl)}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999}
.drw{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:100vw;background:var(--surface);box-shadow:var(--sh-lg);z-index:1000;display:flex;flex-direction:column;border-left:1px solid var(--line-2);animation:drwIn .26s cubic-bezier(.16,1,.3,1)}
@keyframes drwIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drw-h{padding:22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.drw-av{width:52px;height:52px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;font-family:'Sora',sans-serif}
.drw-b{flex:1;overflow-y:auto;padding:20px 22px}
.drw-tab{padding:11px 14px;font-size:12.5px;font-weight:700;color:var(--tx-3);cursor:pointer;border-bottom:2px solid transparent;transition:all .14s}
.drw-tab.act{color:var(--metal);border-bottom-color:var(--accent-2)}
.drw-tab:hover:not(.act){color:var(--tx-2)}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.qa-b{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;transition:all .14s;color:var(--tx-2);font-size:11px;font-weight:700}
.qa-b:hover{border-color:var(--accent-2);color:var(--metal);transform:translateY(-1px)}
.qa-b svg{width:18px;height:18px}
.qa-b.wa:hover{border-color:#25D366;color:#25D366}

.fld{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.fld:last-child{border-bottom:none}
.fld-k{color:var(--tx-3);font-weight:600}
.fld-v{color:var(--tx);font-weight:700;text-align:right;max-width:60%}

.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent-2);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent-2)}
.tl-tx{font-size:12.5px;color:var(--tx);font-weight:700}
.tl-tm{font-size:10.5px;color:var(--tx-4);margin-top:3px;font-weight:600}

.empty{text-align:center;padding:54px 20px;color:var(--tx-3)}
.empty svg{width:42px;height:42px;color:var(--tx-4);margin-bottom:14px}
.empty-t{font-size:15px;font-weight:700;color:var(--tx-2);margin-bottom:5px}
.empty-s{font-size:13px;color:var(--tx-3)}

/* === Login === */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,rgba(158,35,54,.16),transparent 60%)}
.login-c{background:var(--surface);border-radius:var(--rxl);padding:38px 34px;width:100%;max-width:392px;box-shadow:var(--sh-lg);border:1px solid var(--line-2);text-align:center}
.login-c img{width:76px;height:76px;border-radius:18px;border:1px solid var(--line-2);margin:0 auto 18px;display:block}
.login-c h1{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;letter-spacing:.02em}
.login-c h1 em{color:var(--accent-2);font-style:normal}
.login-c p{font-size:12.5px;color:var(--tx-3);margin:6px 0 26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.login-err{font-size:12px;color:var(--red);margin-top:10px;font-weight:700}

/* Suono breve per nuovo lead */
const beep=()=>{try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(880,a.currentTime);o.frequency.setValueAtTime(1175,a.currentTime+.12);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);o.start();o.stop(a.currentTime+.52)}catch(e){}};

const Dashboard=({leads,campaigns,onOpen,onWA,onCall,onAdvance})=>{

  const active=leads.filter(l=>!['acquisito','perso'].includes(l.status)).length;
  const won=leads.filter(l=>l.status==='acquisito');
  const revenue=won.reduce((s,l)=>s+(+l.value||0),0);
  const spend=campaigns.reduce((s,c)=>s+(+c.spend||0),0);
  const adsLeads=leads.filter(l=>l.source!=='form'||l.campaign).length;
  const cpl=adsLeads?spend/adsLeads:0;
  const cpa=won.length?spend/won.length:0;

  const stats=[
    {ic:'users', c:'var(--blue)', bg:'rgba(91,147,232,.14)', v:total,        l:'Lead totali'},
    {ic:'inbox', c:'var(--accent-2)',bg:'rgba(196,42,65,.14)',v:nuovi,        l:'Da contattare'},

/* ============================================================
   PIPELINE — kanban con avanzamento a un tocco + drag&drop
   ============================================================ */
const Pipeline=({leads,campaigns,onCardClick,onStatusChange})=>{
  const [drag,setDrag]=useState(null);
  const [over,setOver]=useState(null);
  const [cmp,setCmp]=useState('all');
  const list=cmp==='all'?leads:leads.filter(l=>l.campaign===cmp);
  return(
    <div>
      <div className="ph">
        <div>
          <div className="ph-t">Pipeline</div>
          <div className="ph-s">Tocca <b style={{color:'var(--tx-2)'}}>la freccia</b> per avanzare il lead. Scorri di lato per cambiare colonna.</div>
        </div>
        <div className="ph-r">
          <select className="fc" style={{width:'auto',minWidth:170}} value={cmp} onChange={e=>setCmp(e.target.value)}>
            <option value="all">Tutte le campagne</option>
            {campaigns.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>

      <div className="pipe-leg">
        {STATUSES.map(s=>(
          <span className="pipe-leg-i" key={s.k}>
            <span style={{width:9,height:9,borderRadius:'50%',background:s.c}}></span>{s.l}
          </span>
        ))}
      </div>

      <div className="kb">
        {STATUSES.map(st=>{
          const items=list.filter(l=>l.status===st.k).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
          const sum=items.reduce((s,l)=>s+(+l.value||0),0);
          return(
            <div className={'kb-col '+(over===st.k?'over':'')} key={st.k}
              style={{'--col-c':st.c,'--col-soft':st.c+'22'}}
              onDragOver={e=>{e.preventDefault();setOver(st.k)}}
              onDragLeave={()=>setOver(o=>o===st.k?null:o)}
              onDrop={()=>{if(drag&&drag.status!==st.k)onStatusChange(drag.id,st.k);setDrag(null);setOver(null)}}>
              <div className="kb-col-top"></div>
              <div className="kb-col-h">
                <span className="kb-col-ic"><I n={st.ic} s={15}/></span>
                <span className="kb-col-t">{st.l}</span>
                <span className="kb-col-cnt">{items.length}</span>
              </div>
              {sum>0&&<div className="kb-col-sum">{fmt(sum)} di valore</div>}
              <div className="kb-col-body">
                {items.map(l=>{
                  const src=SOURCE_MAP[l.source]||SOURCES[3];
                  const svc=svcResolve(l.service);
                  const nx=nextStage(l.status);
                  const nxSt=nx?STATUS_MAP[nx]:null;
                  return(
                    <div key={l.id} className={'kb-card '+(drag?.id===l.id?'drag':'')} draggable
                      onDragStart={()=>setDrag(l)} onDragEnd={()=>{setDrag(null);setOver(null)}}
                      onClick={()=>onCardClick(l)}>
                      <span className="kb-card-src" style={{background:src.c}} title={src.l}></span>
                      <div className="kb-card-top">
                        <div className="kb-card-av" style={{background:avatarColor(l.full_name)}}>{initials(l.full_name)}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div className="kb-card-nm">{l.full_name}</div>
                          <div className="kb-card-sub">{l.city||''}{l.vehicle?' · '+l.vehicle:''}</div>
                        </div>
                      </div>
                      <div className="kb-card-svc"><I n={svc.ic} s={12}/><span>{svc.l}</span></div>
                      <div className="kb-card-ft">
                        <span className="kb-card-val">{l.value?fmt(l.value):'\u2014'}</span>
                        <span className="kb-card-tm">{fmtRel(l.created_at)}</span>
                      </div>
                      <div className="kb-adv" onClick={e=>e.stopPropagation()}>
                        {nxSt?(
                          <button className="kb-adv-b" style={{'--nx-c':nxSt.c,'--nx-soft':nxSt.c+'22'}}
                            title={'Sposta in: '+nxSt.l} onClick={()=>onStatusChange(l.id,nx)}>
                            {nxSt.l}<I n="arrow" s={13}/>
                          </button>
                        ):l.status==='acquisito'?(
                          <button className="kb-adv-b" style={{'--nx-c':'var(--green)','--nx-soft':'rgba(63,191,132,.18)',cursor:'default'}}>
                            <I n="check" s={13}/>Acquisito
                          </button>
                        ):(
                          <button className="kb-adv-b" style={{'--nx-c':'var(--blue)','--nx-soft':'rgba(91,147,232,.18)'}}
                            title="Riapri il lead" onClick={()=>onStatusChange(l.id,'nuovo')}>
                            <I n="reload" s={13}/>Riapri
                          </button>
                        )}
                        {l.status!=='perso'&&l.status!=='acquisito'&&(
                          <div className="kb-adv-x" title="Segna come perso" onClick={()=>onStatusChange(l.id,'perso')}><I n="x" s={13}/></div>
                        )}
                      </div>
                    </div>
                  );
                })}
                {items.length===0&&<div style={{textAlign:'center',padding:'24px 8px',color:'var(--tx-4)',fontSize:11.5}}>Vuoto</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const LeadsList=({leads,campaigns,onCardClick,onAdd,search,setSearch,sFilter,setSFilter,onWA,onCall})=>{

    if(q&&!(l.full_name+' '+l.phone+' '+(l.vehicle||'')+' '+(l.city||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const cmpName=id=>campaigns.find(c=>c.id===id)?.name||'\u2014';

  return(
    <div>
      <div className="ph">

        <div className="empty"><I n="users"/><div className="empty-t">Nessun lead</div><div className="empty-s">{leads.length===0?'I lead da Meta arriveranno qui in automatico':'Modifica i filtri o aggiungi un nuovo lead'}</div></div>

                  <div><div style={{color:'var(--tx)',fontWeight:700}}>{l.full_name}</div>
                    <div style={{fontSize:11,color:'var(--tx-3)',display:'flex',alignItems:'center',gap:5,marginTop:1}}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:src.c}}></span>{src.l}</div></div>
                </div></td>

                <td style={{fontSize:12,color:'var(--tx-3)'}}>{cmpName(l.campaign)}</td>

/* ============================================================

          </div>
          <div className="frow c2">
            <div className="fg"><label className="flbl">Sorgente</label><select className="fc" value={f.source} onChange={e=>upd('source',e.target.value)}>{SOURCES.map(s=><option key={s.k} value={s.k}>{s.l}</option>)}</select></div>

          <button className="btn btn-s" style={{flex:1,justifyContent:'center'}} onClick={onEdit}><I n="edit" s={13}/>Modifica</button>
          <button className="btn btn-d btn-sm" onClick={()=>{if(confirm('Eliminare questo lead?'))onDelete()}}><I n="trash" s={13}/></button>
        </div>
      </div>
    </div>

    {tplOpen&&(
      <div className="mo" style={{zIndex:1500}} onClick={()=>setTplOpen(false)}>
        <div className="md" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
          <div className="mh"><div className="mh-t">Template WhatsApp</div>
            <button className="btn btn-g btn-sm" onClick={()=>setTplOpen(false)}><I n="x" s={14}/></button></div>
          <div className="mb">
            <div style={{fontSize:12.5,color:'var(--tx-3)',marginBottom:14}}>Il messaggio viene compilato con i dati del lead e aperto in WhatsApp.</div>
            <div onClick={()=>sendWA(null)} style={{padding:'12px 14px',border:'1px solid var(--line-2)',borderRadius:9,marginBottom:8,cursor:'pointer',background:'var(--surface-2)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--tx)'}}>\u270F\uFE0F Messaggio vuoto</div>
              <div style={{fontSize:11.5,color:'var(--tx-3)',marginTop:2}}>Apre WhatsApp senza testo</div>
            </div>
            {TEMPLATES.map(t=>(
              <div key={t.id} onClick={()=>sendWA(t)} style={{padding:'12px 14px',border:'1px solid var(--line-2)',borderRadius:9,marginBottom:8,cursor:'pointer',background:'var(--surface-2)',transition:'all .14s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent-2)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--line-2)'}>
                <div style={{fontSize:13,fontWeight:700,color:'var(--tx)'}}>{t.name}</div>
                <div style={{fontSize:11.5,color:'var(--tx-3)',marginTop:3,lineHeight:1.4,whiteSpace:'pre-wrap',maxHeight:54,overflow:'hidden'}}>{fillTpl(t.text,lead).slice(0,110)}\u2026</div>

          </div>
        </div>
      </div>
    )}
    </>
  );
};

/* ============================================================
   CAMPAGNE META ADS

const PLAT={
  facebook:{l:'Facebook',c:'#1877F2',ic:'facebook'},
  instagram:{l:'Instagram',c:'#E1306C',ic:'instagram'},
  both:{l:'Facebook + Instagram',c:'#9E2336',ic:'megaphone'}
};
const CampaignModal=({cmp,onSave,onClose})=>{
  const [f,setF]=useState({
    id:cmp?.id||'',name:cmp?.name||'',platform:cmp?.platform||'both',objective:cmp?.objective||'Lead',
    spend:cmp?.spend??0,active:cmp?.active??true,note:cmp?.note||''
  });
  const upd=(k,v)=>setF(s=>({...s,[k]:v}));
  const submit=()=>{if(!f.name){alert('Inserisci il nome della campagna');return}onSave(f);onClose()};
  return(
    <div className="mo" onClick={onClose}>
      <div className="md" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><div className="mh-t">{cmp?'Modifica campagna':'Nuova campagna'}</div>
          <button className="btn btn-g btn-sm" onClick={onClose}><I n="x" s={14}/></button></div>
        <div className="mb">
          <div className="fg"><label className="flbl">Nome campagna *</label><input className="fc" value={f.name} onChange={e=>upd('name',e.target.value)} placeholder="Es. Sinistro Senza Stress · Pomezia"/></div>
          <div className="frow c2">
            <div className="fg"><label className="flbl">Piattaforma</label><select className="fc" value={f.platform} onChange={e=>upd('platform',e.target.value)}>
              <option value="both">Facebook + Instagram</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option></select></div>
            <div className="fg"><label className="flbl">Obiettivo</label><select className="fc" value={f.objective} onChange={e=>upd('objective',e.target.value)}>
              <option>Lead</option><option>Messaggi</option><option>Traffico</option><option>Notoriet\u00E0</option></select></div>
          </div>
          <div className="frow c2">
            <div className="fg"><label className="flbl">Spesa totale (\u20AC)</label><input className="fc" type="number" min="0" step="10" value={f.spend} onChange={e=>upd('spend',+e.target.value||0)}/></div>
            <div className="fg"><label className="flbl">Stato</label><select className="fc" value={f.active?'1':'0'} onChange={e=>upd('active',e.target.value==='1')}><option value="1">Attiva</option><option value="0">In pausa</option></select></div>
          </div>
          <div className="fg"><label className="flbl">Note</label><textarea className="fc" rows="2" value={f.note} onChange={e=>upd('note',e.target.value)} placeholder="Targeting, creativit\u00E0, periodo\u2026"/></div>
        </div>
        <div className="mf">
          {cmp&&<button className="btn btn-d btn-sm" style={{marginRight:'auto'}} onClick={()=>{if(confirm('Eliminare la campagna? I lead resteranno ma senza campagna.'))onSave({...f,_delete:true});onClose()}}><I n="trash" s={13}/>Elimina</button>}
          <button className="btn btn-s" onClick={onClose}>Annulla</button>
          <button className="btn btn-p" onClick={submit}><I n="check" s={14}/>Salva</button>
        </div>
      </div>
    </div>
  );
};
const Campaigns=({campaigns,leads,onAdd,onEdit})=>{
  const totSpend=campaigns.reduce((s,c)=>s+(+c.spend||0),0);
  const totLeads=leads.length;
  return(
    <div>
      <div className="ph">
        <div><div className="ph-t">Campagne Meta Ads</div><div className="ph-s">{campaigns.length} campagne · {fmt(totSpend)} di spesa · {totLeads} lead generati</div></div>
        <div className="ph-r"><button className="btn btn-a" onClick={onAdd}><I n="plus" s={15}/>Nuova campagna</button></div>
      </div>
      <div className="cmp-grid">
        {campaigns.map(c=>{
          const plat=PLAT[c.platform]||PLAT.both;
          const cl=leads.filter(l=>l.campaign===c.id);
          const won=cl.filter(l=>l.status==='acquisito');
          const cpl=cl.length?(+c.spend||0)/cl.length:0;
          const value=won.reduce((s,l)=>s+(+l.value||0),0);
          return(
            <div key={c.id} className={'cmp-card '+(c.active?'':'off')} onClick={()=>onEdit(c)} style={{cursor:'pointer'}}>
              <div className="cmp-h">
                <div className="cmp-plat" style={{background:plat.c}}><I n={plat.ic} s={19}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="cmp-nm">{c.name}</div>
                  <div className="cmp-meta">{plat.l} · {c.objective} {c.active?'':'· in pausa'}</div>
                </div>
                <button className="btn btn-g btn-sm" onClick={e=>{e.stopPropagation();onEdit(c)}}><I n="edit" s={14}/></button>
              </div>
              <div className="cmp-stats">
                <div className="cmp-st"><div className="cmp-st-v">{fmt(c.spend)}</div><div className="cmp-st-l">Spesa</div></div>
                <div className="cmp-st"><div className="cmp-st-v">{cl.length}</div><div className="cmp-st-l">Lead</div></div>
                <div className="cmp-st"><div className="cmp-st-v acc">{fmt(Math.round(cpl))}</div><div className="cmp-st-l">Costo/lead</div></div>
              </div>
              <div className="cmp-foot">
                <span className="cmp-cpl"><I n="trophy" s={13} c="var(--green)"/> {won.length} acquisiti</span>
                <span className="cmp-cpl">Valore <b>{fmt(value)}</b></span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const App=()=>{
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(ONLINE);
  const [data,setData]=useState(loadStore);
  const [view,setView]=useState('dash');
  const [selected,setSelected]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [editingLead,setEditingLead]=useState(null);
  const [cmpModal,setCmpModal]=useState(null); // {cmp} or {new:true}
  const [search,setSearch]=useState('');
  const [sFilter,setSFilter]=useState('all');
  const [sbOpen,setSbOpen]=useState(false);
  const [toast,showToast]=useToast();

  useEffect(()=>{store.write(data)},[data]);

  const {leads,activities,campaigns}=data;

  /* Sessione Supabase Auth */
  useEffect(()=>{
    if(!ONLINE){setBooting(false);return}
    SB.auth.getSession().then(({data})=>{setSession(data.session||null);setBooting(false)});
    const {data:sub}=SB.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>{try{sub.subscription.unsubscribe()}catch(e){}};
  },[]);

  /* Notifica nuovo lead (suono + toast + notifica desktop se concessa) */
  const notifyNew=row=>{
    showToast('\uD83D\uDD14 Nuovo lead: '+(row.full_name||'cliente'));
    beep();
    try{if(window.Notification&&Notification.permission==='granted'){
      new Notification('Nuovo lead \u2014 Giama Car',{body:(row.full_name||'')+' \u00B7 '+svcLabel(row.service)});
    }}catch(e){}
  };

  /* Carica i lead da Supabase + realtime (make.com inserisce \u2192 compare qui) */
  useEffect(()=>{
    if(!ONLINE||!session)return;
    let mounted=true;
    repo.list().then(rows=>{if(mounted&&rows)setData(d=>({...d,leads:rows}))});
    const ch=SB.channel('giamacar-leads')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:CONFIG.TABLE},p=>{
        const row=p.new;setData(d=>d.leads.some(l=>l.id===row.id)?d:{...d,leads:[row,...d.leads]});notifyNew(row);
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:CONFIG.TABLE},p=>{
        const row=p.new;setData(d=>({...d,leads:d.leads.map(l=>l.id===row.id?{...l,...row}:l)}));
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:CONFIG.TABLE},p=>{
        const id=p.old.id;setData(d=>({...d,leads:d.leads.filter(l=>l.id!==id)}));
      })
      .subscribe();
    return()=>{mounted=false;try{SB.removeChannel(ch)}catch(e){}};
  },[session]);

  /* Chiede una sola volta il permesso notifiche desktop dopo il login */
  useEffect(()=>{
    if(session&&window.Notification&&Notification.permission==='default'){
      try{Notification.requestPermission()}catch(e){}
    }
  },[session]);

  const saveLead=async f=>{
    if(editingLead){
      setData(d=>({...d,leads:d.leads.map(l=>l.id===editingLead.id?{...l,...f}:l)}));
      if(ONLINE)repo.update(editingLead.id,f);
      showToast('Lead aggiornato');setEditingLead(null);return;
    }
    if(ONLINE){
      const row=await repo.insert(f);
      if(row){setData(d=>({...d,leads:[row,...d.leads.filter(l=>l.id!==row.id)]}));showToast('Lead creato');return;}
    }
    const nl={...f,id:uid(),created_at:new Date().toISOString()};
    setData(d=>({...d,leads:[nl,...d.leads]}));showToast('Lead creato');
  };
  const deleteLead=id=>{
    setData(d=>({...d,leads:d.leads.filter(l=>l.id!==id),activities:d.activities.filter(a=>a.lead_id!==id)}));
    if(ONLINE)repo.remove(id);
    setSelected(null);showToast('Lead eliminato');
  };
  const changeStatus=(id,status)=>{
    setData(d=>({...d,
      leads:d.leads.map(l=>l.id===id?{...l,status}:l),
      activities:[{id:uid(),lead_id:id,type:'status',content:'Stato \u2192 '+(STATUS_MAP[status]?.l||status),created_at:new Date().toISOString()},...d.activities]
    }));
    if(ONLINE)repo.update(id,{status});
    if(selected?.id===id)setSelected(s=>({...s,status}));
  };
  const addActivity=act=>setData(d=>({...d,activities:[{...act,id:uid(),created_at:new Date().toISOString()},...d.activities]}));

  /* Azioni rapide (spotlight + lista): registrano l'attivit\u00E0 */
  const quickWA=l=>addActivity({lead_id:l.id,type:'whatsapp',content:'WhatsApp inviato (primo contatto)'});
  const quickCall=l=>addActivity({lead_id:l.id,type:'call',content:'Chiamata effettuata'});
  const advance=l=>changeStatus(l.id,nextStage(l.status)||'contattato');
  const saveCampaign=f=>{
    setData(d=>{
      if(f._delete)return {...d,campaigns:d.campaigns.filter(c=>c.id!==f.id)};
      if(f.id&&d.campaigns.find(c=>c.id===f.id))return {...d,campaigns:d.campaigns.map(c=>c.id===f.id?{...c,...f}:c)};
      return {...d,campaigns:[...d.campaigns,{...f,id:f.id||uid()}]};
    });
    showToast(f._delete?'Campagna eliminata':'Campagna salvata');
  };

  if(!ONLINE)return <SetupNotice/>;
  if(booting)return <Splash/>;
  if(!session)return <Login/>;

  const nuovi=leads.filter(l=>l.status==='nuovo').length;
  const nav=[
    {k:'dash',ic:'home',l:'Dashboard'},
    {k:'pipe',ic:'kanban',l:'Pipeline'},
    {k:'leads',ic:'users',l:'Lead',bd:leads.length},
    {k:'cmp',ic:'megaphone',l:'Campagne'}
  ];
  const liveSel=selected?leads.find(l=>l.id===selected.id)||selected:null;
  const logout=()=>{try{SB.auth.signOut()}catch(e){}};

  return(
    <div className="app">
      {sbOpen&&<div className="ovl" onClick={()=>setSbOpen(false)} style={{zIndex:99}}></div>}
      <div className={'sb '+(sbOpen?'open':'')}>
        <div className="logo">

        ))}
        <div className="bd-mob-i" onClick={()=>{setEditingLead(null);setShowForm(true)}}><I n="plus" s={20}/>Nuovo</div>
      </div>

      {showForm&&<LeadForm lead={editingLead} campaigns={campaigns} onSave={saveLead} onClose={()=>{setShowForm(false);setEditingLead(null)}}/>}
      {liveSel&&<LeadDetail lead={liveSel} activities={activities} campaigns={campaigns}
        onClose={()=>setSelected(null)}
        onEdit={()=>{setEditingLead(liveSel);setShowForm(true);setSelected(null)}}
        onDelete={()=>deleteLead(liveSel.id)} onStatusChange={changeStatus} onAddActivity={addActivity} toast={showToast}/>}
      {cmpModal&&<CampaignModal cmp={cmpModal.cmp} onSave={saveCampaign} onClose={()=>setCmpModal(null)}/>}
      <Toast t={toast}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
